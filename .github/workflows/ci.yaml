name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch ephemeris (licensed data, not in repo)
        run: python fetch_ephe.py
      - name: Tests
        run: python -m pytest tests -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: PyInstaller (licensed ephemeris NOT bundled)
        env:
          ASTRO_BUNDLE_EPHE: "0"
        run: pyinstaller --clean --noconfirm AstroProcessor.spec
      - name: Verify swisseph present in dist
        run: |
          $found = Get-ChildItem -Recurse dist\AstroProcessor -Filter "swisseph*" | Select-Object -First 1
          if (-not $found) { throw "swisseph missing from build" }
          Write-Host "swisseph: $($found.FullName)"
      - name: Install Inno Setup
        continue-on-error: true
        run: choco install innosetup -y --no-progress
      - name: Compile installer
        continue-on-error: true
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) { & $iscc AstroProcessor.iss } else { Write-Host "ISCC not found - skipping" }
      - name: Package portable
        run: Compress-Archive -Path dist\AstroProcessor -DestinationPath AstroProcessor-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AstroProcessor-portable
          path: AstroProcessor-portable.zip
      - uses: actions/upload-artifact@v4
        if: hashFiles('installer_output/*.exe') != ''
        with:
          name: AstroProcessor-installer
          path: installer_output/*.exe
